
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
        - "127.0.0.1:1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - eims-sql-data:/var/opt/mssql
    networks:
      - eims-network
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - ${MSSQL_SA_PASSWORD}
        - -C
        - -Q
        - SELECT 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    image: eims-migrator:1.0
    build:
      context: .
      dockerfile: tools/database-migrator/Dockerfile
    environment:
      ConnectionStrings__EimsDatabase: "Server=db,1433;Database=EIMS;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    networks:
      - eims-network
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: eims-api:1.0
    build:
        context: .
        dockerfile: Dockerfile
    ports:
        - "8080:8080"
    environment:
      ConnectionStrings__EimsDatabase: "Server=db,1433;Database=EIMS;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    networks:
      - eims-network
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  eims-network:
    driver: bridge

volumes:
  eims-sql-data:
